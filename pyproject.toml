[project]
name = "mapf"
version = "0.1.0"
description = "Prototipo de Multi-Agent Path Finding (MAPF) sobre un grafo con nodos prima/sombra."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "zensical>=0.0.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain", "src/data_loaders", "src/algorithms", "src/analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
